<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知序 · 本机设置书库口令</title><style>body{margin:0;background:#edf2f5;color:#20394b;font:18px/1.7 system-ui}main{max-width:520px;margin:8vh auto;padding:32px}label{display:block;margin:20px 0}input,button{box-sizing:border-box;width:100%;padding:14px;border:1px solid #92a8b7;border-radius:12px;font:inherit}button{background:#245b77;color:white;cursor:pointer}small{display:block;color:#536776}#state{white-space:pre-line}</style><main><h1>为你的书库设置口令</h1><p>只在这台电脑加密 13 本书。口令不会发送到 GitHub，也不会写入文件或日志。</p><small>至少 16 个字符，推荐 5–6 个随机单词。不要使用短数字密码或其他账户密码。加密文件及书名将公开；弱口令可能被离线猜解。请自行妥善保存口令，遗忘后只能重新加密原书。</small><form id="form"><label>长口令<input id="password" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><label>再次输入<input id="confirm" type="password" autocomplete="new-password" minlength="16" maxlength="256" required></label><button>在本机加密书籍</button></form><p id="state" role="status"></p></main><script>
const form=document.getElementById('form'),state=document.getElementById('state');
form.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('password'),b=document.getElementById('confirm');if(a.value!==b.value){state.textContent='两次口令不同';return;}const body=JSON.stringify({password:a.value,confirm:b.value});a.value='';b.value='';form.querySelector('button').disabled=true;try{const r=await fetch('/encrypt',{method:'POST',headers:{'Content-Type':'application/json','X-Setup-Token':'__CSRF__'},body});if(!r.ok)throw Error('无法开始，请确认口令至少 16 个字符且不是纯数字。');form.hidden=true;state.textContent='正在加密，请保持本机运行…';}catch(e){state.textContent=e.message;form.querySelector('button').disabled=false;}};
const poll=setInterval(async()=>{try{const s=await(await fetch('/status')).json();if(s.phase==='encrypting')state.textContent=`正在加密并校验：${s.finished} / ${s.total} 本`;if(s.phase==='complete'){clearInterval(poll);form.hidden=true;state.textContent='加密完成。请回到对话发送“已设置”，继续部署。口令不需要发给助手。';}if(s.phase==='failed'){clearInterval(poll);state.textContent='加密未完成，请回到对话告知失败，不要发送口令。';}}catch{}},2000);
</script></html>
