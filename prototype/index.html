<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111d" />
    <meta name="description" content="知序——以知识、行动与复盘连接个人长期成长的私域知识操作系统。" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>知序 · Personal Growth OS</title>
    <style>
      body{margin:0;background:#24475e;color:#fff}
      #study-wallpaper{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;pointer-events:none;z-index:0}
      #root{position:relative;z-index:1;visibility:hidden}
      body.background-ready.app-ready #root{visibility:visible}
      #boot{position:fixed;inset:0;z-index:2;display:grid;place-items:center;font:18px/1.8 system-ui}
      #boot section{padding:28px;border-radius:20px;background:#19384ed9;max-width:420px;margin:24px}
      #boot button{color:white;background:#547e96;border:1px solid #ffffff60;padding:10px 16px;border-radius:10px;font:inherit}
      #boot-help{display:none;font-size:14px}
      body.background-ready.app-ready #boot{display:none}
    </style>
  </head>
  <body>
    <img id="study-wallpaper" src="__STUDY_BACKGROUND__" alt="" aria-hidden="true" decoding="sync" />
    <div id="boot" role="status"><section><strong>知序 · 正在打开书房</strong><div id="boot-help"><p>加载比预期慢，可能是网络或缓存问题。请重试；书籍仍保存在私有仓库。</p><button onclick="location.reload()">重新加载</button></div></section></div>
    <noscript>请启用 JavaScript 后打开知序。</noscript>
    <div id="root"></div>
    <script>
      const wallpaper = document.getElementById('study-wallpaper');
      const backgroundReady = () => document.body.classList.add('background-ready');
      wallpaper.decode().then(backgroundReady).catch(() => {
        document.getElementById('boot-help').style.display = 'block';
        document.querySelector('#boot strong').textContent = '背景未能解码，请重新加载';
      });
      setTimeout(() => { document.getElementById('boot-help').style.display = 'block'; }, 10000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
